<!DOCTYPE html>
<html lang="en">

<head>
    <!--
    Form validation handled by HTML and JavaScript
    Formspree handles backend and matches validation requirements initially set by HTML
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Berry Buer">
    <title>Contact Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="sticky_shrink">
        <h1>Berry's Portfolio</h1>
        <nav id="navigation">
            <!--navigation content added by navigation.js-->
        </nav>
    </header>
    <main>
        <section>
            <h2>Contact Form</h2>
            <form id="contact-form" action="https://formspree.io/f/xdabkava" method="POST">
                <fieldset>
                    <!--form elements for users to input into-->
                    <legend>email or submission form</legend>

                    <label for="user-name">Name:</label>
                    <input id="user-name" type="text" name="name" placeholder="Your Name" required></label>

                    <label for="user-email">Email:</label>
                    <input id="user-email" type="email" name="email" placeholder="example@hotmail.com" required></label>

                    <label for="email-subject">Subject:</label>
                    <input id="email-subject" type="text" name="subject" placeholder="Email Subject" required>

                    <label for="user-message">Textarea:</label>
                    <!--minimum length of one; doesn't resize; the internal font is sans-serif -->
                    <textarea id="user-message" style="resize:none;font-family:var(--baseFont);" name="message" rows="7"
                        minlength="1" maxlength="250" placeholder="250 character limit" spellcheck="true"
                        required></textarea>
                    <p>Character Count: <span id="character-count"></span></p>
                    <!--receives character count from JavaScript-->

                    <!--inputs for Formspree-->
                    <input type="hidden" name="_subject" value="Message from itd210 portfolio, contact.html">
                    <input type="text" name="_gotcha" style="display:none;">

                    <label for="submission"><button style="background:inherit;font-size:large;" id="submission"
                            type="submit">Submit your
                            email!</button></label>
                </fieldset>
            </form>

        </section>
    </main>
    <footer>
        <h3>&copy; Berry Buer</h3>
    </footer>
    <!--navigation and header JavaScript-->
    <script src="js/navigation.js"></script>
    <script src="js/nav-toggle.js"></script>
    <script src="js/sticky_shrink.js"></script>
    <!--animation on load-->
    <script src="js/animation.js"></script>
    <script> // form validation and sending
        const form = document.getElementById("contact-form"); // form
        const button = document.getElementById("submission"); // submission button

        // user questions
        const username = document.getElementById("user-name");
        const userEmail = document.getElementById("user-email");
        const userMessage = document.getElementById("user-message");
        const emailSubject = document.getElementById("email-subject");

        window.addEventListener('load', function () {
            // resets form when page is reloaded
            form.reset();
        })

        // custom feedback for invalid for elements when user clicks submit button
        button.onclick = function () {
            // a JavaScript course I dropped covered custom validity so I referenced that
            try {
                if (username.validity.valueMissing) {
                    username.setCustomValidity("Please enter a name");
                } else {
                    username.setCustomValidity("");
                };
                if (userEmail.validity.valueMissing) {
                    userEmail.setCustomValidity("Please enter an email");
                } else {
                    userEmail.setCustomValidity("");
                };
                if (userMessage.validity.valueMissing) {
                    userMessage.setCustomValidity("Why send an empty message? Type something!");
                } else {
                    userMessage.setCustomValidity("");
                };
                if (emailSubject.validity.valueMissing) {
                    emailSubject.setCustomValidity("Please add a subject to the email");
                } else {
                    emailSubject.setCustomValidity("");
                };
            } catch (error) {
                window.alert("An error occurred. Please try again");
            }
        }

        function sendForm() {
            // form handling and connection to Formspree
            let data = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            })
                .then(function (response) {
                    if (response.ok) {
                        form.reset();
                        location.href = "thanks.html"; // goes to thank you page
                    } else {
                        window.alert("An error occurred while submitting the form.")
                    }
                })
                .catch(function () {
                    alert("Network error. Check your connection, please.")
                })
        }

        /* submit event */
        form.addEventListener('submit', (e) => {
            // 'submit' only occurs on success
            e.preventDefault();
            sendForm();
        })
    </script>
    <script>// textarea character counter
        // reference: https://codingartistweb.com/2025/05/building-a-live-character-counter-with-html-css-and-javascript/
        const textbox = document.getElementById("user-message");
        const charCount = document.getElementById("character-count");

        textbox.addEventListener("input", function () {
            const length = textbox.value.length; // updated every time it receives an input
            charCount.textContent = length; // sends the length to the span in the paragraph
        })
    </script>
</body>

</html>
