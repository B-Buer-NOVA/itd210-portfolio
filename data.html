<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Berry Buer">
    <title>Fetch API Practice</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Berry's Portfolio</h1>
        <nav id="navigation">
            <!--navigation content added by HTML-->
        </nav>
    </header>
    <main>
        <section>
            <h2>Fetch Practice</h2>
            <article>
                <h3>Fetch Data</h3>
                <p>This is some JavaScript practice with fetching and displaying data from nested recipes JSON from
                    <a href="https://dummyjson.com/" target="_blank">DummyJSON.com</a>.
                </p>
                <p>Every press of the button will add a recipe below the last recipe</p>
                <h3>Status</h3>
                <p id="loadingMessage" style="display:none;">Loading Request</p> <!--display: none-->
                <p id="errorMessage"></p> <!--receives message from javascript-->
                <h3>Data Container</h3>
                <button id="loadButton">Fetch a Recipe!</button>
                <aside id="dataContainer"></aside> <!--data will go inside container-->
            </article>
        </section>
    </main>
    <footer>
        <h3>&copy; Berry Buer 2026</h3>
    </footer>
    <script src="js/navigation.js"></script>
    <script src="js/nav-toggle.js"></script>
    <script src="js/fetch.js"></script>
</body>


</html>
