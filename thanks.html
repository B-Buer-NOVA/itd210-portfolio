<!DOCTYPE html>
<html lang="en">

<head>
    <!--
    this webpage doesn't need a header, so I excluded it
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Berry Buer">
    <title>Thank you!</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #thank_you {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 15%;
            text-align: center;
            background: radial-gradient(rgba(255, 255, 255, 0.4), transparent, transparent), var(--thankyou);
        }

        #thank_you span {
            /* color clipping */
            background: var(--cuteBlue);
            background-clip: text;
            /* font size */
            color: transparent;
            font-size: clamp(4rem, 6vw, 10rem);
            font-weight: bolder;
            font-family: Gabriola;
        }
    </style>
</head>

<body>
    <main>
        <h2 style="display:none">Thanks for submitting!</h2>
        <div id="thank_you">
            <span>Thank you for your message!</span>
            <button onclick='location.href="index.html"'>Return to home page</button>
        </div>
    </main>
    <footer>
        <h3>&copy; Berry Buer</h3>
    </footer>
</body>
