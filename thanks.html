<!DOCTYPE html>
<html lang="en">

<head>
    <!--
    Since this webpage is only a confirmation / affirmation of contact form submission, 
    it doesn't have a header and only navigates back to index.html
    It also doesn't connect to any of the JavaScript files
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Berry Buer">
    <title>Thank you!</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* design for thank you div */
        #thank_you {
            /* organization for div contents */
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20%;
            text-align: center;

            /* layered background design */
            background:
                radial-gradient(rgba(255, 255, 255, 0.5), transparent, transparent),
                var(--thankyou);
        }

        /* design and clipping for #thank_you title span*/
        #thank_you span {
            /* color clipping */
            background: var(--cuteBlue);
            background-clip: text;

            /* font size */
            color: transparent;
            text-wrap: none;
            font-size: clamp(3em, 4vw, 4.5em);
            font-weight: bolder;
            font-family: var(--thanks);
        }
    </style>
</head>

<body>
    <main>
        <h2 style="display:none">Thanks for submitting!</h2>
        <div id="thank_you">
            <span>Thank you for your message!</span>
            <button onclick='location.href="index.html"'>Return to home page</button>
            <!--the button directs user back to the main page-->
        </div>
    </main>
    <footer>
        <h3>&copy; Berry Buer</h3>
    </footer>
</body>
